name: Drift Dynasty QA
on:
  push:
    paths:
      - 'drift*'
      - 'drift-assets/**'
      - 'tests/drift-browser.spec.mjs'
      - '.github/workflows/drift-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Algorithm regressions
        run: |
          node --experimental-default-type=module drift-spatial.test.mjs
          node --experimental-default-type=module drift-visuals.test.mjs
          node --experimental-default-type=module drift-audio.test.mjs
      - name: Install pinned browser dependencies
        run: npm install --no-save --no-package-lock three@0.160.0 @playwright/test@1.51.1 @dimforge/rapier3d-compat@0.12.0
      - run: npx playwright install --with-deps chromium
      - name: Run browser checks
        run: |
          python3 -m http.server 8765 > /tmp/drift-server.log 2>&1 &
          npx playwright test tests/drift-browser.spec.mjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: drift-test-results
          path: test-results/
